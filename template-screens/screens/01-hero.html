<!--
  Экран = один <section>. Файлы идут в кабинет по алфавиту имён,
  поэтому нумеруем: 01-, 02-, 03-.

  Правила короткой строкой (полностью — в docs/SPEC.md):
  ширина 375, только inline-стили, размеры в px, никаких классов и скриптов.
-->
<section style="width:375; padding:24px; background:#0B0F14; display:flex; flex-direction:column; gap:16">
  <h1 style="font-size:28px; font-weight:700; color:#FFFFFF; line-height:34px">
    Замените этот экран содержимым по брифу
  </h1>

  <p style="font-size:16px; color:#9AA4B2; line-height:22px">
    Шаблон оставлен рабочим: он проходит проверку и импортируется в билдер
    как есть. Удалите текст и соберите свой экран.
  </p>

  <button style="background:#38BDF8; color:#0B0F14; font-size:16px; font-weight:600; padding:14px; border-radius:12px">
    Оставить заявку
  </button>
</section>
